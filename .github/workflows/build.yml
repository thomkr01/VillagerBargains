# Builds one jar per supported Minecraft version, runs the unit tests, then boots a real
# Fabric dedicated server for each version with only this mod installed. A mixin that no
# longer matches vanilla code crashes that boot, so a green run means every hook applied.
# `build` also runs the game tests (src/gametest), which generate real villager offers
# and check the prices each mode produces.
name: Build

on:
  push:
    paths-ignore: [ '**.md', '.github/workflows/research.yml' ]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build, unit tests and game tests
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v5
        with:
          name: villagerbargains-jars
          path: versions/*/build/libs/*.jar
          retention-days: 14

  server-smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        minecraft: [ '26.2', '26.3' ]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/download-artifact@v5
        with:
          name: villagerbargains-jars
          path: jars
      - name: Boot dedicated server
        run: .github/scripts/server-smoke-test.sh "${{ matrix.minecraft }}" jars
