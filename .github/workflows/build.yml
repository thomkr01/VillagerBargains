# Builds the single mod jar, runs the unit tests and the game tests (against the Minecraft
# version the project compiles with), then runs that same jar on a real Fabric dedicated
# server for every supported Minecraft version: a plain boot plus the full game tests.
name: Build

# Runs once per pull request change (not again for the branch push or the merge); the
# Release workflow builds and tests main itself. Use "Run workflow" for a manual run.
on:
  pull_request:
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build, unit tests and game tests
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v7
        with:
          name: villagerbargains-jars
          path: build/libs/*.jar
          retention-days: 14

  # Starts a real game client (no screen attached) and uses the Mod Menu settings screen.
  client-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      # The runner has no OpenGL/Vulkan drivers; Mesa renders in software. Loom adds Xvfb itself on CI.
      - run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dri libglx-mesa0 mesa-vulkan-drivers
      - name: Run client game test
        run: ./gradlew runClientGameTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-test-screenshots
          path: build/run/clientGameTest/screenshots/
          retention-days: 14

  # Keep this list in sync with "minecraft" in src/main/resources/fabric.mod.json.
  server-test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.2'
            fabric_api: '0.161.0+26.2'
          - minecraft: '26.3'
            fabric_api: '0.161.0+26.3'
    name: server-test (${{ matrix.minecraft }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: actions/download-artifact@v8
        with:
          name: villagerbargains-jars
          path: jars
      - name: Boot server and run game tests
        run: .github/scripts/server-test.sh "${{ matrix.minecraft }}" "${{ matrix.fabric_api }}" jars
