# TEMPORARY research job — decompiles vanilla trade classes and lists dependency versions.
# Will be removed once the mod is written.
name: Research
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ '.github/workflows/research.yml' ]
jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc: [ '26.2', '26.3' ]
    steps:
      - uses: actions/setup-java@v4
        with: { java-version: '25', distribution: 'temurin' }
      - name: Versions
        run: |
          echo "### loader"; curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '.[0:3][] | "\(.version) stable=\(.stable)"'
          echo "### fabric-api"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+${{ matrix.mc }}</version>" | tail -3
          echo "### loom"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -5
          echo "### modmenu"; curl -s "https://api.modrinth.com/v2/project/modmenu/version?loaders=%5B%22fabric%22%5D&game_versions=%5B%22${{ matrix.mc }}%22%5D" | jq -r '.[0:3][] | "\(.version_number) \(.game_versions|join(","))"'
          echo "### modmenu maven"; curl -s https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -6
      - name: Decompile
        run: |
          set -e
          URL=$(curl -s https://piston-meta.mojang.com/mc/game/version_manifest_v2.json | jq -r --arg v "${{ matrix.mc }}" '.versions[] | select(.id==$v) | .url')
          CLIENT=$(curl -s "$URL" | jq -r '.downloads.client.url')
          curl -s -o client.jar "$CLIENT"
          curl -s -o vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
          mkdir x && cd x && unzip -q ../client.jar 'net/minecraft/*' && cd ..
          FAPI=$([ "${{ matrix.mc }}" = "26.2" ] && echo 0.161.0+26.2 || echo 0.161.0+26.3)
          curl -s -o fapi.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$FAPI/fabric-api-$FAPI.jar"
          mkdir fapi && (cd fapi && unzip -q ../fapi.jar 'META-INF/jars/*') && ls fapi/META-INF/jars | grep -i -E 'gametest|test' || true
          GT=$(ls fapi/META-INF/jars/*gametest*.jar | head -1)
          echo "### gametest jar $GT"; unzip -l "$GT" | grep -E '\.class|json' | head -40
          for c in $(unzip -l "$GT" | grep -o 'net/fabricmc/fabric/api/gametest/v1/[A-Za-z$]*\.class' | sed 's#/#.#g;s#\.class$##'); do javap -cp "$GT" "$c"; done
          echo "### mc"
          javap -cp client.jar 'net.minecraft.world.level.storage.loot.LootContext$Builder' 'net.minecraft.world.level.storage.loot.LootParams$Builder' net.minecraft.world.entity.npc.villager.VillagerData net.minecraft.gametest.framework.GameTestHelper net.minecraft.world.item.trading.MerchantOffer net.minecraft.world.entity.npc.villager.VillagerProfession net.minecraft.tags.EnchantmentTags net.minecraft.world.item.trading.TradeSets 2>&1 | grep -v '^  private' | grep -v -i 'lambda'
          javap -cp client.jar net.minecraft.world.entity.npc.villager.Villager | grep -i -E 'villagerdata|updateTrades|class|setOffers|getOffers'
          javap -cp client.jar net.minecraft.world.entity.EntityTypes 2>&1 | grep -E 'class|VILLAGER' | head; javap -cp client.jar net.minecraft.world.entity.EntityType | grep -E ' VILLAGER;|class ' | head -3
          javap -cp client.jar net.minecraft.core.registries.Registries | grep -E 'TRADE|VILLAGER'
          javap -cp client.jar net.minecraft.world.item.trading.TradeSet | head -30
          echo "### loom configureTests"; curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/1.18.2/fabric-loom-1.18.2.jar -o loom.jar; unzip -l loom.jar | grep -i -E 'FabricApiExtension|Test' | head; javap -cp loom.jar net.fabricmc.loom.api.fabricapi.FabricApiExtension 'net.fabricmc.loom.api.fabricapi.GameTestSettings' 2>&1 | head -60
