# TEMPORARY: dumps the Fabric client game test API so the client test can be written
# without network access to Fabric's maven. Removed before the PR is opened.
name: Research
on:
  push:
    branches: [ claude/project-thread-2di9m0 ]
    paths: [ '.github/workflows/research.yml' ]
jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Dump APIs
        run: |
          M=https://maven.fabricmc.net/net/fabricmc/fabric-api
          V=6.0.7+4be74c3f5d
          curl -s -o c.jar "$M/fabric-client-gametest-api-v1/$V/fabric-client-gametest-api-v1-$V.jar"
          curl -s -o cs.jar "$M/fabric-client-gametest-api-v1/$V/fabric-client-gametest-api-v1-$V-sources.jar"
          unzip -p c.jar fabric.mod.json
          mkdir s && (cd s && unzip -q ../cs.jar)
          find s -name '*.java' | sort
          for f in $(find s -path '*/api/*' -name '*.java' | sort); do echo "=================== $f"; grep -v -E '^\s*(\*|/\*\*|\*/|import |$)' "$f" | grep -v '^ \*'; done
          echo "=== screenshot dir / CI notes"
          grep -rn -i -E 'screenshots|getenv|getProperty|xvfb|headless|DISABLE' s/net/fabricmc/fabric/impl | head -40
