# Publishes a GitHub release with the mod jar for version `mod_version` (gradle.properties).
#
# Two ways to release (one jar supports every Minecraft version in fabric.mod.json):
#   * Merge to `main` with a new `mod_version`: if no `v<mod_version>` tag exists yet,
#     this workflow builds the jar, creates the tag and publishes the release.
#   * Push a tag `v<mod_version>` (e.g. v2.0.0) yourself.
# A push to `main` whose version is already released does nothing.
#
# The release body lists only what changed in this version. Before each release, replace
# the "What's new" section below and add the same items to CHANGELOG.md.
name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Decide whether to release
        id: version
        run: |
          MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          TAG="v${MOD_VERSION}"
          echo "version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "${TAG}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${MOD_VERSION}"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "${TAG} is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing ${TAG} from main."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.release == 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - if: steps.version.outputs.release == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build
        if: steps.version.outputs.release == 'true'
        run: ./gradlew build
      - name: Publish release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Villager Bargains ${{ steps.version.outputs.version }}
          body: |
            Villager Bargains ${{ steps.version.outputs.version }} for **Minecraft 26.2 and 26.3** (one jar for both).
            Requires Fabric Loader 0.19.5+ and Java 25. Fabric API is not required; Mod Menu and LuckPerms are optional.

            **What's new in 2.4.0**
            * New optional `vanillaDemand` setting (off by default): the demand surcharge stays vanilla in every `pricing` mode, while random price rolls still follow `pricing`.
            * New optional `vanillaWanderingTrader` setting (off by default): wandering trader offers keep vanilla prices and demand, while villagers still follow `pricing`. `bookLevels` and `gearStrength` still apply to its gear.
            * Both have a button in Mod Menu → Villager Bargains, and a command: `/bargain demand <vanilla|pinned>` and `/bargain trader <vanilla|pinned>`, with permission nodes `villagerbargains.command.demand` and `villagerbargains.command.trader` (operator by default).

            Full history: [CHANGELOG.md](https://github.com/thomkr01/VillagerBargains/blob/main/CHANGELOG.md)
          files: build/libs/villagerbargains-${{ steps.version.outputs.version }}.jar
