# Publishes a GitHub release with the mod jar for version `mod_version` (gradle.properties).
#
# Two ways to release (one jar supports every Minecraft version in fabric.mod.json):
#   * Merge to `main` with a new `mod_version`: if no `v<mod_version>` tag exists yet,
#     this workflow builds the jar, creates the tag and publishes the release.
#   * Push a tag `v<mod_version>` (e.g. v2.0.0) yourself.
# A push to `main` whose version is already released does nothing.
name: Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Decide whether to release
        id: version
        run: |
          MOD_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          TAG="v${MOD_VERSION}"
          echo "version=${MOD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "${TAG}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match mod_version ${MOD_VERSION}"; exit 1; }
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "${TAG} is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing ${TAG} from main."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.release == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - if: steps.version.outputs.release == 'true'
        uses: gradle/actions/setup-gradle@v5
      - name: Build
        if: steps.version.outputs.release == 'true'
        run: ./gradlew build
      - name: Publish release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Villager Bargains ${{ steps.version.outputs.version }}
          body: |
            Villager Bargains ${{ steps.version.outputs.version }} for **Minecraft 26.2 and 26.3** (one jar for both).
            Requires Fabric Loader 0.19.5+ and Java 25. Fabric API is not required; Mod Menu is optional.

            **What's new in 2.1**
            * New optional `bookLevels` setting (MINIMUM / NORMAL default / MAXIMUM) pins the level of enchanted books sold by villagers, e.g. always Sharpness V. In Mod Menu → Villager Bargains → Book levels, or `config/villagerbargains.json`. Loot books and gear are unchanged.
            * Mod info now lists Thomas as author and links the project homepage.
            * Internal cleanup, a real game client test of the settings screen on CI, and a fix for the Java 25 `sun.misc.Unsafe` warning in CI server runs.

            **From 2.0**
            * Pricing modes MINIMUM (default) / NORMAL / MAXIMUM, in Mod Menu or `config/villagerbargains.json`.
            * Enchanted books: MINIMUM `2 + 3×level`, MAXIMUM `6 + 13×level` (treasure enchantments doubled).
            * Enchanted tools, weapons and armor: MINIMUM base + 5, MAXIMUM base + 19; enchantments stay vanilla.
            * Demand: MINIMUM never raises prices after buying a trade out; MAXIMUM always charges the sold-out surcharge.
            * Reputation, curing discounts and Hero of the Village work as in vanilla on top of every mode.
          files: build/libs/villagerbargains-${{ steps.version.outputs.version }}.jar
