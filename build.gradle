// Shared build logic. Every versions/<mc> subproject is configured here; the subproject
// itself only provides a gradle.properties file and any version-specific sources.
plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
    apply plugin: 'net.fabricmc.fabric-loom'

    def mc = project.minecraft_version

    version = "${rootProject.mod_version}+${mc}"
    group = rootProject.maven_group
    base.archivesName = rootProject.archive_base_name

    repositories {
        maven {
            name = 'TerraformersMC (Mod Menu)'
            url = 'https://maven.terraformersmc.com/releases/'
        }
    }

    loom {
        splitEnvironmentSourceSets()

        mods {
            "villagerbargains" {
                sourceSet sourceSets.main
                sourceSet sourceSets.client
            }
        }

        runs.configureEach {
            runDir = "../../run/${mc}"
        }
    }

    // Shared sources from the repository root, plus this subproject's own src/.
    sourceSets {
        main {
            java.srcDir rootProject.file('src/main/java')
            resources.srcDir rootProject.file('src/main/resources')
        }
        client {
            java.srcDir rootProject.file('src/client/java')
            resources.srcDir rootProject.file('src/client/resources')
        }
        test {
            java.srcDir rootProject.file('src/test/java')
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${mc}"
        // Minecraft 26.x is unobfuscated: no mappings needed.
        implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"

        // Optional integration: compiled against, never bundled or required.
        compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

        // Only for `runClient` / `runServer` in development (Mod Menu needs Fabric API).
        localRuntime "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
        localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

        testImplementation platform('org.junit:junit-bom:5.13.4')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    test {
        useJUnitPlatform()
    }

    processResources {
        def props = [
                version             : project.version,
                loader_version      : rootProject.loader_version,
                minecraft_dependency: project.minecraft_dependency,
        ]
        inputs.properties props
        filesMatching('fabric.mod.json') {
            expand props
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 25
        it.options.encoding = 'UTF-8'
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    jar {
        from(rootProject.file('LICENSE')) {
            rename { "${it}_villagerbargains" }
        }
    }
}
