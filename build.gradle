plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archive_base_name

repositories {
    // Add mod repositories here if needed
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "villagerbargains" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// ── Trade resource generator ──────────────────────────────────────────────────
// Reads config/villagerbargains.json (or uses defaults) and writes one JSON
// file per trade into src/main/resources/data/ before processResources runs.
// Run manually:  ./gradlew generateTradeResources
// Run on build:  automatic (wired below)
tasks.register('generateTradeResources', GenerateTradeResourcesTask) {
    // Output goes directly into the resources tree so Fabric picks it up
    outputDir = file('src/main/resources')

    // Point at the project-level config file if it already exists.
    // On a fresh checkout this file won’t exist yet; defaults are used instead.
    def cfgFile = file('config/villagerbargains.json')
    if (cfgFile.exists()) {
        configFile = cfgFile
    }
}

processResources {
    // Ensure trade JSON files are regenerated before resources are packaged
    dependsOn 'generateTradeResources'

    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName
    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        // Add publishing repositories here if needed
    }
}
